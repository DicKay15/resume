experience:
  - company: CodeBuddy
    location: Pune
    title: Product Designer
    dates: Feb 2025 to May 2026
    bullets:
      - Led product design across [[seven client products]] in healthcare, security, creator economy, and enterprise SaaS, partnering with founders, product managers, and engineers from discovery through production handoff.
      - Led end-to-end design for N1 Care, an AI clinical intelligence platform, as the sole designer on a 23-person team. Shaped [[10 product areas]] spanning patient management, clinical records, diagnostics, and clinician-reviewed reports; an internal clinician review reported [[75% less analysis and report-generation time]].
      - Built N1 Care's [[80+ component design system]], defined human-review states and a [[28-point AI report quality checklist]], and prototyped [[45 clinical data visualizations]] in HTML/CSS/SVG and ApexCharts for engineering validation.
      - Designed the full Expand Health AI longevity platform, turning wearable, lab, lifestyle, and clinical data into a four-score triage workflow and an interactive prototype used for team and investor reviews.
      - Co-led Riskabilitie, an enterprise risk-management SaaS, using stakeholder workshops to define permission-aware workflows, assessment and approval flows, analytics dashboards, and executive reporting.
      - Owned product design and front-end engineering for Proposal Buddy, shown publicly as GetPosals, shipping lead management, AI-assisted drafting, approvals, analytics, document sharing, and client delivery in React, TypeScript, and Cloudflare.
      - Designed and developed [[7+ production Framer websites]] for startups and client businesses.


name: Generate resume

on:
  push:
    branches:
      - main
    paths:
      - content/**
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/generate-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and validate resume
        run: npm run check

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/html/resume.html output/pdf/Dhrumil-Kherde-Product-Designer-Resume.pdf
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: regenerate resume"
            git push
          fi
